        /* Summer Out East — same shell as the Work grid */
        .summer-page {
            padding: 80px 0;
        }

        .summer-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 60px;
        }

        .summer-meta {
            font-size: 12px;
            letter-spacing: 1.5px;
            color: #666666;
            margin-bottom: 30px;
        }

        /* Justified rows: each row is scaled to fill the width exactly,
           so photos keep their real proportions (no cropping). */
        .summer-grid {
            --gap: 8px;
            position: relative;
        }

        .summer-item {
            position: absolute;
            overflow: hidden;
            background: #f2f2f2;
        }

        .summer-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }

        /* Fallback before JS runs: simple stacked images */
        .summer-grid:not(.is-laid-out) .summer-item {
            position: static;
            margin-bottom: 8px;
        }
        .summer-grid:not(.is-laid-out) .summer-item img {
            height: auto;
        }

        @media (max-width: 968px) {
            .summer-container {
                padding: 0 30px;
            }

            .summer-grid {
                --gap: 6px;
            }
        }

        @media (max-width: 768px) {
            .summer-page {
                padding: 40px 0;
            }

            .summer-container {
                padding: 0 20px;
            }

            .summer-grid {
                --gap: 5px;
            }
        }
    </style>

    <script src="script.js"></script>
    <script>
        (function () {
            const grid = document.getElementById('summer-grid');
            const tiles = Array.from(grid.querySelectorAll('.summer-item'));

            // Accumulate photos by aspect ratio until a row reaches the target
            // height, then scale that row to fit the container width exactly.
            function layout() {
                const gap = parseFloat(getComputedStyle(grid).getPropertyValue('--gap')) || 8;
                const width = grid.clientWidth;
                const targetH = window.innerWidth > 968 ? 480 : (window.innerWidth > 768 ? 360 : 260);

                let row = [], rowAr = 0, top = 0;

                function flush(isLast) {
                    if (!row.length) return;
                    const free = width - (row.length - 1) * gap;
                    const h = isLast ? Math.min(targetH, free / rowAr) : free / rowAr;
                    let left = 0;
                    row.forEach(t => {
                        const w = t._ar * h;
                        t.style.left = left + 'px';
                        t.style.top = top + 'px';
                        t.style.width = w + 'px';
                        t.style.height = h + 'px';
                        left += w + gap;
                    });
                    top += h + gap;
                    row = []; rowAr = 0;
                }

                tiles.forEach(t => {
                    t._ar = parseFloat(t.dataset.ar) || 0.75;
                    row.push(t);
                    rowAr += t._ar;
                    if (rowAr * targetH + (row.length - 1) * gap >= width) flush(false);
                });
                flush(true);

                grid.style.height = Math.max(0, top - gap) + 'px';
                grid.classList.add('is-laid-out');
            }

            layout();
            let raf;
            window.addEventListener('resize', () => {
                cancelAnimationFrame(raf);
                raf = requestAnimationFrame(layout);
            });

            // Disable right-click and drag on images
            tiles.forEach(t => {
                const img = t.querySelector('img');
                img.addEventListener('contextmenu', e => e.preventDefault());
                img.addEventListener('dragstart', e => e.preventDefault());
            });
        })();
    </script>
</body>
</html>
