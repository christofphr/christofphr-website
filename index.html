    <style>
        /* Work Grid Styles */
        .work-grid-page {
            padding: 80px 0;
        }
        
        .work-grid-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 60px;
        }
        
        .work-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            grid-auto-flow: dense;
        }
        
        .work-grid-item {
            overflow: hidden;
        }
        
        .work-grid-item.landscape {
            grid-column: span 2;
        }
        
        .work-grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }
        
        /* Mobile adjustments */
        @media (max-width: 968px) {
            .work-grid-container {
                padding: 0 30px;
            }
            
            .work-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }
            
            .work-grid-item.landscape {
                grid-column: span 2;
            }
        }
        
        @media (max-width: 768px) {
            .work-grid-page {
                padding: 40px 0;
            }
            
            .work-grid-container {
                padding: 0 20px;
            }
            
            .work-grid {
                grid-template-columns: 1fr;
                gap: 5px;
            }
            
            .work-grid-item.landscape {
                grid-column: span 1;
            }
        }
    </style>
</head>
