<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Summer Out East — Chris Lucas</title>
<meta name="description" content="East Hampton, Amagansett, Montauk. Photographs by Chris Lucas.">
<style>
:root{
  --bg:#0e0d0b;
  --fg:#efe9dd;
  --dim:#8b8377;
  --gap:6px;
  --col:230px;
  --row:152px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--fg);
  font:400 13px/1.6 ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ---- masthead ---- */
.mast{
  padding:15vh 5vw 9vh;
  max-width:1000px;
}
.mast h1{
  font:400 clamp(38px,8.5vw,104px)/0.94 "Times New Roman",Times,serif;
  letter-spacing:-0.025em;
}
.mast h1 em{ font-style:italic; }
.mast .meta{
  margin-top:26px; display:flex; gap:26px; flex-wrap:wrap;
  font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
}
.mast .meta span+span::before{
  content:"–"; margin-right:8px; color:var(--dim);
}

/* ---- grid ---- */
.grid{
  position:relative;
  margin-bottom:12vh;
}
.t{
  position:absolute; overflow:hidden; background:#1a1815;
}
.t img{
  width:100%; height:100%; object-fit:cover; display:block;
  pointer-events:none; user-select:none;
  -webkit-user-drag:none; -webkit-touch-callout:none;
}

/* ---- foot ---- */
footer{
  padding:0 5vw 10vh; display:flex; gap:30px; flex-wrap:wrap;
  font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim);
}
footer a{ color:var(--dim); text-decoration:none; border-bottom:1px solid #2c2823; padding-bottom:2px; }
footer a:hover{ color:var(--fg); border-color:var(--fg); }

@media (max-width:640px){
  :root{ --gap:4px; }
  .mast{ padding:11vh 6vw 7vh; }
}
@media (prefers-reduced-motion:reduce){
  html{ scroll-behavior:auto; }
}
</style></head>

<script>
const grid=document.getElementById('g');
const tiles=[...document.querySelectorAll('.t')];

/* True masonry: each tile's height comes from its real aspect ratio
   (data-ar, width/height), not a guessed row span, so mixed portrait
   and landscape photos always pack with zero leftover gaps. Wide
   tiles (--w:2 or 3) are placed across whichever adjacent columns
   are shortest at that point. */
function numColsFor(w){ return w>900 ? 4 : 2; }

function layout(){
  const cs=getComputedStyle(grid);
  const gap=parseFloat(cs.getPropertyValue('--gap'))||6;
  const cols=numColsFor(window.innerWidth);
  const innerWidth=grid.clientWidth-2*gap;
  const colW=(innerWidth-(cols-1)*gap)/cols;
  const colH=new Array(cols).fill(0);

  tiles.forEach(t=>{
    const wSpan=Math.min(parseInt(getComputedStyle(t).getPropertyValue('--w'))||1, cols);
    const ar=parseFloat(t.dataset.ar)||0.75;
    let start=0, best=Infinity;
    for(let i=0;i<=cols-wSpan;i++){
      let h=0;
      for(let k=0;k<wSpan;k++) h=Math.max(h,colH[i+k]);
      if(h<best){ best=h; start=i; }
    }
    const tileW=wSpan*colW+(wSpan-1)*gap;
    const tileH=tileW/ar;
    t.style.left=(gap+start*(colW+gap))+'px';
    t.style.top=best+'px';
    t.style.width=tileW+'px';
    t.style.height=tileH+'px';
    const newBottom=best+tileH+gap;
    for(let k=0;k<wSpan;k++) colH[start+k]=newBottom;
  });

  grid.style.height=Math.max(...colH)+'px';
}
layout();
addEventListener('resize', layout);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);
</script>
