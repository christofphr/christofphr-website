<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>christofphr - Club 55</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Preload first 3 images -->
    <link rel="preload" as="image" href="club-55/photo1.jpg">
    <link rel="preload" as="image" href="club-55/photo2.jpg">
    <link rel="preload" as="image" href="club-55/photo3.jpg">
    
    <style>
        /* Horizontal Scroll Specific Styles */
        .horizontal-scroll-page {
            position: fixed;
            top: 0;
            left: 200px;
            right: 0;
            bottom: 0;
            background: #ffffff;
            overflow-x: auto;
            overflow-y: hidden;
        }
        
        .horizontal-container {
            display: flex;
            height: 100vh;
            padding: 0 60px;
            gap: 7px;
            align-items: center;
        }
        
        .horizontal-item {
            flex-shrink: 0;
            height: 85vh;
            display: flex;
            align-items: center;
        }
        
        .horizontal-item img {
            height: 100%;
            width: auto;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }
        
        /* Hide scrollbar but keep functionality */
        .horizontal-scroll-page::-webkit-scrollbar {
            display: none;
        }
        
        .horizontal-scroll-page {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Mobile adjustments */
        @media (max-width: 968px) {
            .horizontal-scroll-page {
                left: 0;
            }
            
            .horizontal-container {
                padding: 0 20px;
                gap: 5px;
            }
            
            .horizontal-item {
                height: 60vh;
            }
        }
    </style>
</head>
<body>
    <!-- Left Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-content">
            <a href="index.html" class="logo">christofphr</a>
            
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="index.html">WORK</a></li>
                    <li><a href="out-east.html">OUT EAST</a></li>
                    <li><a href="club55.html" class="active">CLUB 55</a></li>
                    <li><a href="winter.html">WINTER</a></li>
                    <li><a href="prints.html">PRINTS</a></li>
                    <li><a href="about.html">ABOUT</a></li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Horizontal Scroll Page -->
    <div class="horizontal-scroll-page">
        <div class="horizontal-container">
            <div class="horizontal-item">
                <img src="club-55/photo1.jpg" loading="eager" alt="Club 55 by christofphr">
            </div>
            <div class="horizontal-item">
                <img src="club-55/photo2.jpg" loading="eager" alt="Club 55 by christofphr">
            </div>
            <div class="horizontal-item">
                <img src="club-55/photo3.jpg" loading="eager" alt="Club 55 by christofphr">
            </div>
            <div class="horizontal-item">
                <img src="club-55/photo4.jpg" loading="lazy" alt="Club 55 by christofphr">
            </div>
            <div class="horizontal-item">
                <img src="club-55/photo5.jpg" loading="lazy" alt="Club 55 by christofphr">
            </div>
            <div class="horizontal-item">
                <img src="club-55/photo6.jpg" loading="lazy" alt="Club 55 by christofphr">
            </div>
            <div class="horizontal-item">
                <img src="club-55/photo7.jpg" loading="lazy" alt="Club 55 by christofphr">
            </div>
            <div class="horizontal-item">
                <img src="club-55/photo8.jpg" loading="lazy" alt="Club 55 by christofphr">
            </div>
            <div class="horizontal-item">
                <img src="club-55/photo9.jpg" loading="lazy" alt="Club 55 by christofphr">
            </div>
            <div class="horizontal-item">
                <img src="club-55/photo10.jpg" loading="lazy" alt="Club 55 by christofphr">
            </div>
            <div class="horizontal-item">
                <img src="club-55/photo11.jpg" loading="lazy" alt="Club 55 by christofphr">
            </div>
            <div class="horizontal-item">
                <img src="club-55/photo12.jpg" loading="lazy" alt="Club 55 by christofphr">
            </div>
            <div class="horizontal-item">
                <img src="club-55/photo13.jpg" loading="lazy" alt="Club 55 by christofphr">
            </div>
            <div class="horizontal-item">
                <img src="club-55/photo14.jpg" loading="lazy" alt="Club 55 by christofphr">
            </div>
            <!-- Spacer at the end -->
            <div style="width: 60px; flex-shrink: 0;"></div>
        </div>
    </div>

<script src="script.js"></script>
<script>
    // Enable horizontal scroll with mouse wheel
    const scrollContainer = document.querySelector('.horizontal-scroll-page');
    
    scrollContainer.addEventListener('wheel', (evt) => {
        evt.preventDefault();
        scrollContainer.scrollLeft += evt.deltaY;
    });
    
    // Disable right-click and drag on images
    const images = document.querySelectorAll('.horizontal-item img');
    
    images.forEach(img => {
        img.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        img.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
        });
    });
    
    // Auto-hide sidebar on scroll (DESKTOP ONLY)
    const sidebar = document.querySelector('.sidebar');
    
    // Add transition for smooth animation
    scrollContainer.style.transition = 'left 0.3s ease';
    
    // Only enable auto-hide on desktop (screen width > 968px)
    scrollContainer.addEventListener('scroll', function() {
        // Check if desktop
        if (window.innerWidth > 968) {
            if (scrollContainer.scrollLeft > 50) {
                sidebar.style.display = 'none';
                scrollContainer.style.left = '0';
            } else {
                sidebar.style.display = 'block';
                scrollContainer.style.left = '200px';
            }
        }
    });
    
    // Reset sidebar on window resize
    window.addEventListener('resize', function() {
        if (window.innerWidth <= 968) {
            // On mobile, always show sidebar and reset position
            sidebar.style.display = 'block';
            scrollContainer.style.left = '0';
        }
    });
</script>
</body>
</html>
