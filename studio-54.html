    <style>
        /* Studio 54 Grid Styles */
        .studio-grid-page {
            padding: 80px 0;
        }
        
        .studio-grid-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 60px;
        }
        
        .studio-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            align-items: start;
        }
        
        .studio-item {
            overflow: hidden;
        }
        
        .studio-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .studio-item.landscape {
            grid-column: span 2;
        }
        
        /* Mobile adjustments */
        @media (max-width: 968px) {
            .studio-grid-container {
                padding: 0 30px;
            }
            
            .studio-grid {
                gap: 15px;
            }
        }
        
        @media (max-width: 768px) {
            .studio-grid-page {
                padding: 40px 0;
            }
            
            .studio-grid-container {
                padding: 0 20px;
            }
            
            .studio-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .studio-item.landscape {
                grid-column: span 1;
            }
        }
    </style>
</head>
