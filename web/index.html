<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Summer Out East — Chris Lucas</title>
<meta name="description" content="East Hampton, Amagansett, Montauk. Photographs by Chris Lucas.">
<style>
:root{
  --bg:#0e0d0b;
  --fg:#efe9dd;
  --dim:#8b8377;
  --gap:6px;
  --col:230px;
  --row:152px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--fg);
  font:400 13px/1.6 ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ---- masthead ---- */
.mast{
  padding:15vh 5vw 9vh;
  max-width:1000px;
}
.mast h1{
  font:400 clamp(38px,8.5vw,104px)/0.94 "Times New Roman",Times,serif;
  letter-spacing:-0.025em;
}
.mast h1 em{ font-style:italic; }
.mast .meta{
  margin-top:26px; display:flex; gap:26px; flex-wrap:wrap;
  font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
}
.mast .meta span{ position:relative; }
.mast .meta span+span::before{
  content:""; position:absolute; left:-14px; top:50%;
  width:4px; height:1px; background:var(--dim);
}

/* ---- grid ---- */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-auto-rows:var(--row);
  gap:var(--gap);
  padding:0 var(--gap) 12vh;
}
.t{
  position:relative; overflow:hidden; background:#1a1815;
  grid-column:span var(--w,1);
  grid-row:span 5;
  opacity:0; transform:translateY(14px);
  transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1);
}
.t.wide{ grid-row:span 4; }
.t.in{ opacity:1; transform:none; }
.t img{
  width:100%; height:100%; object-fit:cover; display:block;
  filter:saturate(.94);
  transition:transform 1.1s cubic-bezier(.2,.7,.3,1), filter .5s;
  cursor:pointer;
}
.t:hover img{ transform:scale(1.035); filter:saturate(1.06); }

/* index number, revealed on hover */
.t::after{
  content:attr(data-seq);
  position:absolute; left:9px; bottom:7px;
  font:500 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.14em; color:#fff; mix-blend-mode:difference;
  opacity:0; transition:opacity .35s;
  pointer-events:none;
}
.t:hover::after{ opacity:.85; }

/* ---- lightbox ---- */
.lb{
  position:fixed; inset:0; z-index:90;
  background:rgba(14,13,11,.97);
  display:none; align-items:center; justify-content:center;
  padding:4vh 5vw;
}
.lb.on{ display:flex; }
.lb img{
  max-width:100%; max-height:92vh; object-fit:contain;
  animation:pop .45s cubic-bezier(.2,.7,.3,1);
}
@keyframes pop{ from{opacity:0; transform:scale(.985)} to{opacity:1; transform:none} }
.lb .nav{
  position:absolute; top:0; height:100%; width:22%;
  border:0; background:none; cursor:pointer; color:transparent;
}
.lb .prev{ left:0; } .lb .next{ right:0; }
.lb .close{
  position:absolute; top:20px; right:24px; background:none; border:0;
  color:var(--fg); font:400 26px/1 serif; cursor:pointer; opacity:.55;
}
.lb .close:hover{ opacity:1; }
.lb .cnt{
  position:absolute; bottom:20px; left:0; right:0; text-align:center;
  font:500 10px/1 ui-monospace,monospace; letter-spacing:.22em; color:var(--dim);
}

/* ---- foot ---- */
footer{
  padding:0 5vw 10vh; display:flex; gap:30px; flex-wrap:wrap;
  font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim);
}
footer a{ color:var(--dim); text-decoration:none; border-bottom:1px solid #2c2823; padding-bottom:2px; }
footer a:hover{ color:var(--fg); border-color:var(--fg); }

@media (max-width:900px){
  .grid{ grid-template-columns:repeat(2,1fr); }
  .t{ grid-column:span 1; }
  .t.wide{ grid-column:span 2; }
}
@media (max-width:640px){
  :root{ --gap:4px; }
  .mast{ padding:11vh 6vw 7vh; }
}
@media (prefers-reduced-motion:reduce){
  .t{ opacity:1; transform:none; transition:none; }
  .t:hover img{ transform:none; }
  .lb img{ animation:none; }
  html{ scroll-behavior:auto; }
}
</style></head>

<script>
const grid=document.getElementById('g');
const tiles=[...document.querySelectorAll('.t')];

/* Row height is derived from the real column width, not guessed.

   A portrait is colW wide, so its true height is colW/0.758.
   It spans 5 rows, which includes 4 internal gaps:
       row = (colW/0.758 - 4*gap) / 5

   A landscape spans 2 columns (2*colW + gap) and 4 rows
   (4*row + 3*gap). Because a landscape's true height is
   0.794 of a portrait's and 4/5 = 0.800, that cell sits
   within ~0.7% of the true 1.934 ratio — a sub-pixel crop.
   Both shapes therefore land flush on the same row grid
   and no tile is left short of its cell. */
function sizeRows(){
  const cs=getComputedStyle(grid);
  const cols=cs.gridTemplateColumns.split(' ').filter(Boolean);
  if(!cols.length) return;
  const colW=parseFloat(cols[0]);
  const gap=parseFloat(cs.gap)||6;
  const row=(colW/0.758 - 4*gap)/5;
  grid.style.setProperty('--row', row.toFixed(3)+'px');
}
sizeRows();
addEventListener('resize', sizeRows);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(sizeRows);

/* reveal on scroll, slight stagger within a row */
const io=new IntersectionObserver((es)=>{
  es.forEach((e,i)=>{
    if(e.isIntersecting){
      setTimeout(()=>e.target.classList.add('in'), (i%4)*70);
      io.unobserve(e.target);
    }
  });
},{rootMargin:'80px'});
tiles.forEach(t=>io.observe(t));

/* lightbox */
const lb=document.getElementById('lb'), lbi=document.getElementById('lbi'), cnt=document.getElementById('c');
let cur=0;
function show(i){
  cur=(i+tiles.length)%tiles.length;
  const src=tiles[cur].querySelector('img').src;
  lbi.src=src;
  cnt.textContent=String(cur+1).padStart(3,'0')+' / '+tiles.length;
  lb.classList.add('on');
  document.body.style.overflow='hidden';
}
function hide(){ lb.classList.remove('on'); document.body.style.overflow=''; }
tiles.forEach((t,i)=>t.querySelector('img').addEventListener('click',()=>show(i)));
document.getElementById('x').onclick=hide;
document.getElementById('n').onclick=e=>{e.stopPropagation();show(cur+1)};
document.getElementById('p').onclick=e=>{e.stopPropagation();show(cur-1)};
lb.addEventListener('click',e=>{ if(e.target===lb||e.target===lbi) hide(); });
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('on'))return;
  if(e.key==='Escape')hide();
  if(e.key==='ArrowRight')show(cur+1);
  if(e.key==='ArrowLeft')show(cur-1);
});
</script>
</body></html>
