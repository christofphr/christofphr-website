    <style>
        /* Austin John-style strip: the page scrolls sideways */
        html, body { height: 100%; overflow: hidden; }
        .strip {
            position: fixed; top: 0; bottom: 0; left: var(--sidebar); right: 0;
            overflow-x: auto; overflow-y: hidden;
            scrollbar-width: none;
            overscroll-behavior-x: contain;
        }
        .strip::-webkit-scrollbar { display: none; }
        .track {
            display: flex; align-items: center; gap: 14px;
            height: 100%; padding: 0 40px 0 40px;
            width: max-content;
        }
        .frame { height: calc(100vh - 140px); flex: none; background: var(--tile); }
        .frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .end { flex: none; width: 1px; }
        .draft-flag { top: 14px; bottom: auto; }

        .strip-ui {
            position: fixed; left: calc(var(--sidebar) + 40px); right: 40px; bottom: 26px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 10px; letter-spacing: 1.8px; color: var(--muted);
            pointer-events: none;
        }
        .strip-ui .bar { flex: 1; height: 1px; background: var(--rule); margin: 0 24px; position: relative; }
        .strip-ui .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); width: 0; }
        .strip-ui button { pointer-events: auto; background: none; border: 0; font: inherit; letter-spacing: inherit; color: inherit; cursor: pointer; padding: 6px 0; }
        .strip-ui button:hover { color: var(--ink); }

        @media (max-width: 968px) {
            html, body { height: auto; overflow: auto; }
            .strip { position: static; height: 72vh; }
            .track { padding: 0 20px; gap: 8px; }
            .frame { height: calc(72vh - 40px); }
            .strip-ui { position: static; padding: 6px 20px 30px; }
            .strip-ui .bar { margin: 0 16px; }
        }

    <script>
    (function () {
        const strip = document.getElementById('strip');
        const frames = Array.from(strip.querySelectorAll('.frame'));
        const count = document.getElementById('count');
        const progress = document.getElementById('progress');
        const pad = n => String(n).padStart(2, '0');

        // Mouse wheel scrolls sideways (desktop)
        strip.addEventListener('wheel', e => {
            if (window.innerWidth <= 968) return;
            if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                e.preventDefault();
                strip.scrollLeft += e.deltaY;
            }
        }, { passive: false });

        function current() {
            const mid = strip.scrollLeft + 60;
            let i = 0;
            frames.forEach((f, n) => { if (f.offsetLeft <= mid) i = n; });
            return i;
        }
        function go(i) {
            i = Math.max(0, Math.min(frames.length - 1, i));
            strip.scrollTo({ left: frames[i].offsetLeft - 40, behavior: 'smooth' });
        }
        function update() {
            const max = strip.scrollWidth - strip.clientWidth;
            const i = strip.scrollLeft >= max - 2 ? frames.length - 1 : current();
            count.textContent = pad(i + 1) + ' / ' + pad(frames.length);
            progress.style.width = (max > 0 ? strip.scrollLeft / max * 100 : 0) + '%';
        }
        strip.addEventListener('scroll', update, { passive: true });
        document.getElementById('prev').onclick = () => go(current() - 1);
        document.getElementById('next').onclick = () => go(current() + 1);
        addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') { e.preventDefault(); go(current() + 1); }
            if (e.key === 'ArrowLeft')  { e.preventDefault(); go(current() - 1); }
        });
        update();
    })();
    </script>
